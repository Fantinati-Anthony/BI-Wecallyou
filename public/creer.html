<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Des tickets papier qui préviennent vos clients quand c'est leur tour. Gratuit, sans compte, sans pub, open source, et les coordonnées sont illisibles pour le serveur.">
  <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
  <title>Créer mes tickets · WeCall.You</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/qrcode.js" defer></script>
  <script type="module" src="/assets/create.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/assets/icon.svg" alt="" width="30" height="30"><span>WeCall<span class="brand-dot">.</span>You</span></a>
    <nav class="topnav">
      <a class="btn btn-ghost" href="/pro"><span data-icon="star"></span><span class="label" data-i18n="nav_pro">Offre Pro</span></a>
      <a class="btn btn-ghost" href="/compte"><span data-icon="user-circle"></span><span class="label" data-i18n="acc_link">Mon compte</span></a>
      <a class="btn btn-ghost" href="/m"><span data-icon="storefront"></span><span class="label" data-i18n="to_dashboard">Espace commerçant</span></a>
    </nav>
  </header>

  <main class="wrap wrap-studio">
    <section id="creer">
      <div class="section-head">
        <div class="label-row title-row"><h1 data-i18n="create_title">Créer mes tickets</h1><span data-tip="studio_lede"></span></div>
      </div>
      <div class="studio">
        <form id="create-form" class="studio-form" novalidate>
          <div class="card studio-tabs">
            <div class="tabbar" role="tablist" aria-label="Créer mes tickets">
              <button type="button" role="tab" id="tab-info" aria-controls="panel-info" aria-selected="true"><span data-icon="ticket"></span><span data-i18n="tab_info">Informations</span></button>
              <button type="button" role="tab" id="tab-message" aria-controls="panel-message" aria-selected="false" tabindex="-1"><span data-icon="chat-centered-text"></span><span data-i18n="tab_message">Message</span></button>
              <button type="button" role="tab" id="tab-look" aria-controls="panel-look" aria-selected="false" tabindex="-1"><span data-icon="palette"></span><span data-i18n="tab_look">Apparence</span></button>
            </div>
            <section class="tab-panel" role="tabpanel" id="panel-info" aria-labelledby="tab-info">
              <div class="field">
                <label for="name" data-i18n="create_name">Nom affiché aux clients</label>
                <input id="name" name="name" type="text" maxlength="60" required autocomplete="organization" data-i18n-placeholder="create_name_ph">
              </div>
              <div class="field" id="activity-slot"></div>
              <fieldset class="field" id="mode-field">
                <legend><label data-i18n="mode_title">Comment vos clients obtiennent-ils leur numéro ?</label></legend>
                <div class="choice-row">
                  <label class="choice"><input type="radio" name="mode" value="tickets" checked><span data-tip="mode_hint_tickets"></span><span data-icon="ticket"></span><span data-i18n="mode_tickets">Tickets imprimés</span></label>
                  <label class="choice"><input type="radio" name="mode" value="poster"><span data-tip="mode_hint_poster"></span><span data-icon="qr-code"></span><span data-i18n="mode_poster">Affiche à scanner</span></label>
                  <label class="choice"><input type="radio" name="mode" value="both"><span data-tip="mode_hint_both"></span><span data-icon="squares-four"></span><span data-i18n="mode_both">Les deux</span></label>
                </div>
              </fieldset>
              <div class="inline-fields field">
                <div id="count-field">
                  <label for="count" data-i18n="create_count">Nombre de tickets</label>
                  <input id="count" name="count" type="number" min="1" max="999999" value="120" inputmode="numeric" required>
                </div>
                <div>
                  <label for="first" data-i18n="create_first">Premier numéro</label>
                  <input id="first" name="first" type="number" min="1" max="999999" value="1" inputmode="numeric" required>
                </div>
              </div>
              <fieldset class="field">
                <legend class="label-row"><label data-i18n="create_channels">Moyens proposés à vos clients</label><span id="channels-tip"></span></legend>
                <div class="choice-row cols-4">
                  <label class="choice"><input type="checkbox" name="channels" value="push" checked><span data-icon="bell-ringing"></span><span data-i18n="ch_push"></span></label>
                  <label class="choice"><input type="checkbox" name="channels" value="sms" checked><span data-icon="chat-circle-text"></span><span data-i18n="ch_sms"></span></label>
                  <label class="choice"><input type="checkbox" name="channels" value="wa" checked><span data-icon="whatsapp-logo"></span><span data-i18n="ch_wa"></span></label>
                  <label class="choice"><input type="checkbox" name="channels" value="mail" checked><span data-icon="envelope-simple"></span><span data-i18n="ch_mail"></span></label>
                </div>
              </fieldset>
              <div class="field">
                <div class="label-row"><label for="ttl" data-i18n="create_ttl">Durée de vie d’un ticket après son premier scan</label><span data-tip="ttl_hint"></span></div>
                <select id="ttl" name="ttl" class="select"></select>
              </div>
              <div class="field">
                <div class="label-row"><label for="password" data-i18n="create_password">Mot de passe du lot (facultatif, conseillé)</label><span data-tip="create_password_hint"></span></div>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="8">
                <div class="field" id="password2-field" hidden>
                  <label for="password2" data-i18n="create_password2">Confirmez le mot de passe</label>
                  <input id="password2" name="password2" type="password" autocomplete="new-password">
                </div>
              </div>
            </section>
            <section class="tab-panel" role="tabpanel" id="panel-message" aria-labelledby="tab-message" hidden>
              <div id="message-slot"></div>
              <div class="field">
                <div class="label-row"><label for="promo" data-i18n="create_promo">Votre message (facultatif)</label><span data-tip="promo_hint"></span></div>
                <input id="promo" name="promo" type="text" maxlength="140" data-i18n-placeholder="create_promo_ph">
              </div>
              <div class="field">
                <label for="link" data-i18n="create_link">Votre lien (facultatif)</label>
                <input id="link" name="link" type="url" maxlength="200" inputmode="url" data-i18n-placeholder="create_link_ph">
              </div>
            </section>
            <section class="tab-panel" role="tabpanel" id="panel-look" aria-labelledby="tab-look" hidden>
              <section class="panel-sec" id="layout-section">
                <h3 data-i18n="studio_layout">Papier et mise en page</h3>
                <div id="design-layout"></div>
              </section>
              <section class="panel-sec">
                <h3><span data-i18n="studio_colors">Couleurs et logo</span><span class="badge pro-badge"><span data-icon="star"></span>Pro</span></h3>
                <div id="design-colors"></div>
              </section>
              <section class="panel-sec pro-tools" id="pro-tools">
                <h3><span data-i18n="pro_tools_title">Options Pro</span><span class="badge pro-badge"><span data-icon="star"></span>Pro</span></h3>
                <div id="pro-slot"></div>
              </section>
            </section>
          </div>
          <p class="error" id="create-error" role="alert" hidden></p>
          <button class="btn btn-big btn-block" type="submit" data-i18n="create_btn">Créer mes tickets</button>
          <p class="small muted center" data-i18n="service_note"></p>
        </form>
        <div id="preview-slot"></div>
      </div>
    </section>

    <section id="created" hidden></section>

  </main>

  <footer class="footer">
    <span data-i18n="service_note">Service gratuit, sans pub, financé par les dons.</span>
    <nav>
      <a href="/soutenir" data-i18n="support_link">Soutenir le projet</a>
      <a href="/pro" data-i18n="nav_pro">Offre Pro</a>
      <a href="/confidentialite" data-i18n="privacy">Confidentialité</a>
      <a href="/mentions" data-i18n="legal">Mentions légales et CGV</a>
      <a href="https://github.com/Fantinati-Anthony/BI-Wecallyou" data-i18n="open_source">Code source</a>
    </nav>
  </footer>
</body>
</html>
